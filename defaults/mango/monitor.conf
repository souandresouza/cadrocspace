# monitor.conf -- regras de monitor (específicas de cada máquina).
#
# Este arquivo NÃO é versionado: o deploy.sh semeia esta versão vazia na
# primeira instalação e você o ajusta à sua tela. Sem regras, o mango detecta
# os monitores e usa o modo preferido de cada um.
#
# Para gerar as regras a partir da sessão atual:
#   ~/.config/scripts/detect-monitors.sh            # mostra as regras
#   ~/.config/scripts/detect-monitors.sh --write    # grava neste arquivo
#   mmsg dispatch reload_config                     # aplica
#
# Sintaxe: https://github.com/mangowm/mango/wiki/monitors
#
# Exemplo (descomente e ajuste):
# monitor_rule=name:^eDP-1$,width:1920,height:1080,refresh:60,x:0,y:0,scale:1,vrr:0,rr:0
# monitor_rule=name:^HDMI-A-1$,width:2560,height:1440,refresh:144,x:1920,y:0,scale:1,vrr:0,rr:0
