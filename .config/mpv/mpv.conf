# Corrige crash do mpv ao passar o mouse na janela (OSC/OSD).
#
# Causa: mpv 0.42.0 usa gpu-next + Vulkan (waylandvk) por padrao e o driver
# RADV (libvulkan_radeon.so, mesa 26.3.1) dá SIGSEGV quando o OSC/OSD é
# renderizado (mouse sobre a janela, tecla 'i', etc.).
# Confirmado por coredump e reproduzido com 'script-message osc-visibility'.
# Bug upstream: https://github.com/mpv-player/mpv/issues/18588
#
# Forçar OpenGL evita o caminho Vulkan do RADV e mantém a reprodução normal.
gpu-api=opengl
